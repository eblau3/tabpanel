<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabpanel</title>
  <style>
    * {
      box-sizing: border-box;
      padding: unset;
      margin: unset;
    }
  </style>
  <link rel="stylesheet" href="style.css">
  <script src="tabpanel.js" defer></script>
</head>
<body>
  <div class="js-tabpanel" role="tablist">
    <button class="tab js-tabpanel-tab" id="tab-1" role="tab" aria-controls="panel-1" aria-selected="false">タブ-1</button>
    <button class="tab js-tabpanel-tab" id="tab-2" role="tab" aria-controls="panel-2" aria-selected="false">タブ-2</button>
    <div class="panel js-tabpanel-panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1" aria-hidden="true"><img src="https://placehold.jp/600x400.png?text=パネル-1"></div>
    <div class="panel js-tabpanel-panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" aria-hidden="true"><img src="https://placehold.jp/600x400.png?text=パネル-2"></div>
  </div>
</body>
</html>
